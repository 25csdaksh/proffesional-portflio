<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-sanjeevni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f12"/>
      <stop offset="100%" stop-color="#24141a"/>
    </linearGradient>
    <radialGradient id="glow-sanjeevni" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-sanjeevni" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3b1f28" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-sanjeevni)"/>
  <rect width="800" height="450" fill="url(#glow-sanjeevni)"/>
  <rect width="800" height="450" fill="url(#grid-sanjeevni)"/>
  
  <circle cx="620" cy="225" r="160" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <circle cx="620" cy="225" r="110" fill="none" stroke="#e2c286" stroke-width="1" stroke-opacity="0.25"/>
  
  <!-- Hospital / Plus Cross with AI Circuit Icon -->
  <g transform="translate(565, 175)" stroke="#fb7185" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="35" y="10" width="30" height="80" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
    <rect x="10" y="35" width="80" height="30" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
    <circle cx="50" cy="50" r="10" stroke="#e2c286" stroke-width="2"/>
  </g>
  
  <!-- Project Branding Content -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="15" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fb7185" letter-spacing="1">HOSPITAL MANAGEMENT ERP</text>
    
    <text x="0" y="80" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#f3f4f6">Sanjeevni AI</text>
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e2c286" font-weight="500">Hospital ERP, IPD, Billing &amp; Medical Report AI</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8e95a5">NestJS · PostgreSQL · Prisma · Redis · BullMQ</text>
    
    <!-- Status badge -->
    <g transform="translate(0, 185)">
      <circle cx="6" cy="6" r="4" fill="#fb7185"/>
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8e95a5" font-weight="500">Status: Development</text>
    </g>
  </g>
</svg>

