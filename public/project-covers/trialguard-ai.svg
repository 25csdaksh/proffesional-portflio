<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-trial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d18"/>
      <stop offset="100%" stop-color="#1d152c"/>
    </linearGradient>
    <radialGradient id="glow-trial" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-trial" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e2147" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-trial)"/>
  <rect width="800" height="450" fill="url(#glow-trial)"/>
  <rect width="800" height="450" fill="url(#grid-trial)"/>
  
  <!-- Subtle circular arcs -->
  <circle cx="620" cy="225" r="160" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <circle cx="620" cy="225" r="110" fill="none" stroke="#e2c286" stroke-width="1" stroke-opacity="0.25"/>
  
  <!-- Shield / Trial Security Icon -->
  <g transform="translate(570, 175)" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 15 L85 30 C85 65 65 90 50 100 C35 90 15 65 15 30 Z" fill="#a855f7" fill-opacity="0.15"/>
    <path d="M36 52 L46 62 L66 42" stroke="#e2c286" stroke-width="3"/>
  </g>
  
  <!-- Project Branding Content -->
  <g transform="translate(60, 105)">
    <rect x="0" y="0" width="235" height="26" rx="13" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3"/>
    <text x="15" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="1">IBM BoB HACKATHON 2026</text>
    
    <text x="0" y="80" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#f3f4f6">TrialGuard AI</text>
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e2c286" font-weight="500">Clinical Trial Risk Monitor &amp; Protocol Deviation</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8e95a5">Python · FastAPI · Clinical Audit AI · Anomaly Detection</text>
    
    <!-- Status badge -->
    <g transform="translate(0, 185)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8e95a5" font-weight="500">Status: Hackathon Project</text>
    </g>
  </g>
</svg>

